[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-llm-alpaca"
version = "0.1.0"
description = "Paper-only crypto trading research system using Alpaca, structured LLM features, and rule-based execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "alpaca-py>=0.30.0",
  "openai>=1.60.0",
  "pandas>=2.2.0",
  "python-dotenv>=1.0",
  "plotly>=5.24.0",
  "streamlit>=1.37.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]

[project.scripts]
crypto-llm = "crypto_llm_alpaca.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
